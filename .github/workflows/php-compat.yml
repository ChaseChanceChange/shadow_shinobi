name: PHP compatibility

on:
  push:
    branches: [main, modernize-safe-pass]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    container: php:8.2-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint active game sources
        shell: sh
        run: |
          find 'ShadowShinobiBrowserMMO/src/0-August-2018(latest)' -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f 'ShadowShinobiBrowserMMO/docker-compose.yml' config

      - name: Build and start full stack
        run: docker compose -f 'ShadowShinobiBrowserMMO/docker-compose.yml' up -d --build

      - name: Verify database service
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if docker compose -f 'ShadowShinobiBrowserMMO/docker-compose.yml' exec -T db mariadb \
              -u shadow -pshadow_dev_password shadow_shinobi \
              -e "SELECT COUNT(*) AS table_count FROM information_schema.tables WHERE table_schema='shadow_shinobi';"; then
              exit 0
            fi
            sleep 2
          done
          echo 'Database did not accept a SQL connection after startup.'
          exit 1

      - name: Verify public pages are clean
        run: |
          set -euo pipefail
          check_page() {
            url="$1"
            output="$2"
            for i in {1..30}; do
              if curl --fail --silent --show-error "$url" > "$output"; then
                break
              fi
              sleep 2
            done
            test -s "$output"
            if grep -Eqi 'Warning:|Deprecated:|Notice:|Fatal error:|Parse error:|Uncaught ' "$output"; then
              echo "Runtime error text found in $url"
              return 1
            fi
          }
          check_page 'http://127.0.0.1:8080/login.php?do=login' /tmp/login.html
          check_page 'http://127.0.0.1:8080/help.php' /tmp/help.html
          check_page 'http://127.0.0.1:8080/rank.php' /tmp/rank.html

      - name: Verify rendered JavaScript syntax
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path('/tmp/help.html').read_text(encoding='utf-8', errors='replace')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript blocks found in rendered help page')
          Path('/tmp/rendered-page.js').write_text('\n\n'.join(scripts), encoding='utf-8')
          print(f'Extracted {len(scripts)} inline script block(s)')
          PY
          node --check /tmp/rendered-page.js

      - name: Verify developer diagnostics and login cookie
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8080/dev_health.php > /tmp/dev-health.html
          grep -q 'Core checks passing' /tmp/dev-health.html
          # Capture Set-Cookie without following redirects
          curl --silent --show-error -D /tmp/dev-login.headers -o /tmp/dev-login.body \
            -c /tmp/shadow.cookies -b /tmp/shadow.cookies \
            'http://127.0.0.1:8080/login.php?do=dev' || true
          grep -qi '^Set-Cookie:.*dkgame=' /tmp/dev-login.headers
          grep -q dkgame /tmp/shadow.cookies
          # Follow redirect with cookie jar
          curl --fail --silent --show-error -L -c /tmp/shadow.cookies -b /tmp/shadow.cookies \
            'http://127.0.0.1:8080/login.php?do=dev' > /tmp/dev-login.html
          test -s /tmp/dev-login.html
          if grep -Eqi 'Warning:|Deprecated:|Notice:|Fatal error:|Parse error:|Uncaught ' /tmp/dev-login.html; then
            echo 'Runtime error text found after developer login'
            exit 1
          fi
          if grep -Eqi 'ss-login__form|name="username"' /tmp/dev-login.html; then
            echo 'Still on login page after developer login'
            exit 1
          fi
          grep -q 'Shadow Shinobi' /tmp/dev-login.html

      - name: Verify authenticated shell pages
        run: |
          set -euo pipefail
          check_auth() {
            name="$1"
            url="$2"
            output="/tmp/${name}.html"
            code=$(curl --silent --show-error -o "$output" -w '%{http_code}' -b /tmp/shadow.cookies "$url")
            if [[ "$code" == "302" || "$code" == "301" ]]; then
              loc=$(curl --silent --show-error -I -b /tmp/shadow.cookies "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2; exit}')
              if echo "$loc" | grep -qi 'login.php'; then
                echo "$name redirected to login: $loc"
                exit 1
              fi
            fi
            if [[ ! -s "$output" && "$code" != "302" ]]; then
              echo "Empty body for $name (HTTP $code)"
              exit 1
            fi
            if [[ -s "$output" ]]; then
              if grep -Eqi 'Warning:|Deprecated:|Notice:|Fatal error:|Parse error:|Uncaught ' "$output"; then
                echo "Runtime error text found in $url"
                exit 1
              fi
              if grep -Eqi 'ss-login__form|name="username"' "$output"; then
                echo "Login form rendered for authenticated route $name"
                exit 1
              fi
            fi
            echo "OK $name HTTP $code"
          }
          check_auth home 'http://127.0.0.1:8080/index.php'
          check_auth backpack 'http://127.0.0.1:8080/backpack.php'
          check_auth character 'http://127.0.0.1:8080/index.php?do=showchar'
          check_auth rank 'http://127.0.0.1:8080/rank.php'
          check_auth help 'http://127.0.0.1:8080/help.php'
          check_auth town_inn 'http://127.0.0.1:8080/index.php?do=inn'
          check_auth explore_move 'http://127.0.0.1:8080/index.php?do=move'

      - name: Run packaged smoke script
        run: |
          chmod +x ShadowShinobiBrowserMMO/scripts/smoke-test.sh
          BASE_URL=http://127.0.0.1:8080 bash ShadowShinobiBrowserMMO/scripts/smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f 'ShadowShinobiBrowserMMO/docker-compose.yml' logs --no-color

      - name: Shut down stack
        if: always()
        run: docker compose -f 'ShadowShinobiBrowserMMO/docker-compose.yml' down -v
