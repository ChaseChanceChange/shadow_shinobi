name: PHP compatibility

on:
  push:
    branches: [main, modernize-safe-pass]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    container: php:8.2-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint active game sources
        shell: sh
        run: |
          find 'ShadowShinobiBrowserMMO/src/0-August-2018(latest)' -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web image
        run: docker build -t shadow-shinobi-php:ci 'ShadowShinobiBrowserMMO'
