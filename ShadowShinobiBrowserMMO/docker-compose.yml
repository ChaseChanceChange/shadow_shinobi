services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: shadow-shinobi-php:8.2-apache
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: shadow
      DB_PASSWORD: shadow_dev_password
      DB_NAME: shadow_shinobi
      DB_PREFIX: dk
      GAME_SECRET: local-development-secret-change-me
    volumes:
      - ./src/0-August-2018(latest):/var/www/html
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: shadow_shinobi
      MARIADB_USER: shadow
      MARIADB_PASSWORD: shadow_dev_password
      MARIADB_ROOT_PASSWORD: root_dev_password
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u shadow -pshadow_dev_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - shadow-db:/var/lib/mysql
      - ./database (sql)/shadow_shinobi.sql:/docker-entrypoint-initdb.d/01-shadow.sql:ro
  db-admin:
    image: phpmyadmin:5-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
volumes:
  shadow-db:
